name: CI

# Runs on every pull request, into any branch — so a feature -> dev merge is
# gated by the same suite that gates a dev -> main promotion.
#
# Job ids double as the required status-check contexts named in the branch
# ruleset — rename one and that required check hangs forever. This repo is a
# single package rather than a backend/frontend pair, so the ids are `build`
# and `e2e` rather than the `backend`/`frontend`/`e2e` used by the apps.
on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # The library bundle consumers install...
      - name: Build library
        run: npm run build

      # ...and the showcase, which is what the e2e suite renders. Building both
      # here means a break in either is attributed to this job rather than
      # surfacing as a confusing Playwright failure.
      - name: Build showcase
        run: npm run build:showcase

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Only Chromium — the suite pins that project, and pulling all three
      # browsers roughly triples install time for no extra coverage.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
